<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GRIMM emblem</title>
  <desc id="desc">A silver house roof framing a bold G, with a red accent.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f1f1"/>
      <stop offset=".48" stop-color="#929292"/>
      <stop offset="1" stop-color="#d8d8d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" stroke-linejoin="round">
    <!-- House roof -->
    <path d="M54 220 256 58l202 162h-63L256 111 117 220z" fill="url(#metal)"/>
    <path d="m108 218 148-119 148 119h-35L256 129 143 218z" fill="#111"/>
    <path d="m112 203 144-116 144 116" fill="none" stroke="#d71920" stroke-width="12"/>
    <!-- Chimney -->
    <path d="M367 117h47v17h-47z" fill="#d71920"/>
    <path d="M378 134h27v43l-27-22z" fill="#d71920"/>
    <!-- Window -->
    <path d="M231 150h23v23h-23zm31 0h23v23h-23zm-31 31h23v23h-23zm31 0h23v23h-23z" fill="url(#metal)"/>
    <!-- G monogram -->
    <path d="M342 247H194c-37 0-65 28-65 65v92c0 37 28 65 65 65h139c21 0 34-13 34-34V339h-120v52h58v21H201c-11 0-18-7-18-18v-86c0-11 7-18 18-18h141z" fill="url(#metal)"/>
    <path d="M298 339h69v52h-69z" fill="#d71920"/>
    <path d="M318 356h29v18h-29z" fill="#111"/>
  </g>
</svg>
